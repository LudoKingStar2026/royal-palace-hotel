<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Royal Palace Hotel - Room Management</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

button,input,select,textarea{font:inherit}
button{cursor:pointer}

.sidebar{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:250px;
  background:#111a3a;
  color:#fff;
  z-index:1000;
  display:flex;
  flex-direction:column;
  transition:.25s ease;
}

.brand{
  height:82px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 22px;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.brand-logo{
  width:42px;
  height:42px;
  border-radius:12px;
  background:linear-gradient(135deg,#7c4dff,#a855f7);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
  font-weight:800;
}

.brand-text strong{
  display:block;
  font-size:16px;
}

.brand-text span{
  display:block;
  margin-top:3px;
  color:#aab3cf;
  font-size:11px;
}

.nav{
  padding:18px 12px;
  flex:1;
}

.nav button{
  width:100%;
  border:0;
  background:transparent;
  color:#b9c1d8;
  padding:13px 15px;
  margin-bottom:6px;
  border-radius:9px;
  display:flex;
  align-items:center;
  gap:13px;
  text-align:left;
  font-size:14px;
  transition:.2s;
}

.nav button:hover{
  background:rgba(255,255,255,.08);
  color:#fff;
}

.nav button.active{
  background:#7451e8;
  color:#fff;
  box-shadow:0 5px 15px rgba(116,81,232,.25);
}

.nav-icon{
  width:20px;
  text-align:center;
  font-size:17px;
}

.website-btn{
  margin:15px 12px 20px;
  padding:13px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:9px;
  background:rgba(255,255,255,.06);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}

.main{
  margin-left:250px;
  min-height:100vh;
}

.topbar{
  height:82px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 30px;
  border-bottom:1px solid #e8ebf2;
  position:sticky;
  top:0;
  z-index:500;
}

.menu-btn{
  display:none;
  width:42px;
  height:42px;
  border:0;
  border-radius:10px;
  background:#f0edff;
  color:#6d48df;
  font-size:22px;
}

.top-title{
  font-size:20px;
  font-weight:700;
}

.profile{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#7451e8;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
}

.content{
  padding:30px;
}

.hero{
  background:linear-gradient(135deg,#6941d9,#8c5cf2);
  border-radius:15px;
  padding:27px 28px;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  margin-bottom:25px;
  box-shadow:0 10px 30px rgba(105,65,217,.18);
}

.hero h1{
  margin:0 0 8px;
  font-size:25px;
}

.hero p{
  margin:0;
  color:#eee9ff;
  font-size:14px;
}

.add-btn{
  border:0;
  background:#fff;
  color:#6941d9;
  padding:12px 18px;
  border-radius:9px;
  font-weight:700;
  white-space:nowrap;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
  margin-bottom:25px;
}

.stat{
  background:#fff;
  border:1px solid #e9ecf3;
  border-radius:13px;
  padding:20px;
  box-shadow:0 3px 12px rgba(20,30,60,.04);
}

.stat-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.stat-icon{
  width:40px;
  height:40px;
  border-radius:10px;
  background:#f0edff;
  color:#7048e8;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
}

.stat-number{
  font-size:27px;
  font-weight:800;
  margin-top:15px;
}

.stat-label{
  color:#788197;
  font-size:13px;
  margin-top:4px;
}

.section{
  background:#fff;
  border:1px solid #e9ecf3;
  border-radius:14px;
  padding:23px;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.section-head h2{
  margin:0;
  font-size:18px;
}

.section-head span{
  color:#81899d;
  font-size:13px;
}

.rooms-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.room-card{
  border:1px solid #e6e9f0;
  border-radius:13px;
  overflow:hidden;
  background:#fff;
  position:relative;
  transition:.2s;
}

.room-card:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 25px rgba(20,30,60,.08);
}

.room-image{
  height:170px;
  background:#e9edf5;
  position:relative;
  overflow:hidden;
}

.room-image img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.no-image{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#98a1b5;
  font-size:42px;
}

.status{
  position:absolute;
  top:12px;
  left:12px;
  padding:6px 10px;
  border-radius:20px;
  font-size:11px;
  font-weight:700;
  background:#dcfce7;
  color:#15803d;
}

.status.booked{
  background:#fee2e2;
  color:#b91c1c;
}

.status.maintenance{
  background:#fef3c7;
  color:#b45309;
}

.more{
  position:absolute;
  right:10px;
  top:10px;
}

.more-btn{
  width:34px;
  height:34px;
  border:0;
  border-radius:8px;
  background:rgba(255,255,255,.94);
  font-size:19px;
  color:#30384b;
}

.room-menu{
  display:none;
  position:absolute;
  right:0;
  top:40px;
  width:145px;
  background:#fff;
  border:1px solid #e4e7ee;
  border-radius:9px;
  box-shadow:0 10px 30px rgba(20,30,60,.15);
  z-index:20;
  overflow:hidden;
}

.room-menu.show{
  display:block;
}

.room-menu button{
  width:100%;
  padding:10px 12px;
  border:0;
  background:#fff;
  text-align:left;
  font-size:13px;
  color:#333b4e;
}

.room-menu button:hover{
  background:#f5f6fa;
}

.room-menu .delete{
  color:#dc2626;
}

.room-info{
  padding:17px;
}

.room-name{
  font-size:17px;
  font-weight:700;
  margin-bottom:7px;
}

.room-number{
  color:#7c8497;
  font-size:12px;
}

.room-bottom{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin-top:17px;
}

.price{
  color:#6941d9;
  font-size:18px;
  font-weight:800;
}

.price small{
  color:#8a91a2;
  font-size:11px;
  font-weight:400;
}

.edit-small{
  border:0;
  background:#f1efff;
  color:#6842d9;
  padding:7px 11px;
  border-radius:7px;
  font-size:12px;
  font-weight:600;
}

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:900;
}

.overlay.show{
  display:block;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(10,15,35,.55);
  z-index:2000;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:520px;
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:15px;
  box-shadow:0 20px 60px rgba(0,0,0,.2);
}

.modal-head{
  padding:20px 22px;
  border-bottom:1px solid #edf0f5;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.modal-head h3{
  margin:0;
  font-size:19px;
}

.close{
  border:0;
  background:#f1f3f7;
  width:34px;
  height:34px;
  border-radius:8px;
  font-size:20px;
  color:#596174;
}

.form{
  padding:22px;
}

.form-group{
  margin-bottom:16px;
}

.form-group label{
  display:block;
  margin-bottom:7px;
  font-size:13px;
  font-weight:700;
  color:#40485b;
}

.form-group input,
.form-group select{
  width:100%;
  border:1px solid #dfe3eb;
  border-radius:8px;
  padding:11px 12px;
  outline:none;
  background:#fff;
}

.form-group input:focus,
.form-group select:focus{
  border-color:#7952e8;
  box-shadow:0 0 0 3px rgba(121,82,232,.1);
}

.form-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.modal-actions{
  padding:18px 22px;
  border-top:1px solid #edf0f5;
  display:flex;
  justify-content:flex-end;
  gap:10px;
}

.cancel-btn{
  border:1px solid #dfe3eb;
  background:#fff;
  padding:10px 16px;
  border-radius:8px;
}

.save-btn{
  border:0;
  background:#7048df;
  color:#fff;
  padding:10px 18px;
  border-radius:8px;
  font-weight:700;
}

.toast{
  position:fixed;
  right:22px;
  bottom:22px;
  background:#172033;
  color:#fff;
  padding:13px 17px;
  border-radius:9px;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
  transform:translateY(100px);
  opacity:0;
  pointer-events:none;
  transition:.3s;
  z-index:3000;
  font-size:13px;
}

.toast.show{
  transform:translateY(0);
  opacity:1;
}

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:45px 20px;
  color:#8a92a5;
}

@media(max-width:1050px){
  .rooms-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:800px){
  .sidebar{
    transform:translateX(-100%);
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    margin-left:0;
  }

  .menu-btn{
    display:block;
  }

  .topbar{
    padding:0 16px;
    gap:12px;
  }

  .top-title{
    flex:1;
    font-size:17px;
  }

  .content{
    padding:18px 14px 30px;
  }

  .hero{
    padding:21px;
    align-items:flex-start;
    flex-direction:column;
  }

  .hero h1{
    font-size:21px;
  }

  .add-btn{
    width:100%;
  }

  .rooms-grid{
    grid-template-columns:1fr;
  }

  .stats{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .stat{
    padding:15px;
  }

  .stat-number{
    font-size:23px;
  }

  .section{
    padding:16px;
  }
}

@media(max-width:480px){
  .stats{
    grid-template-columns:1fr 1fr;
  }

  .form-row{
    grid-template-columns:1fr;
  }

  .profile{
    width:36px;
    height:36px;
  }

  .room-image{
    height:185px;
  }
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">

  <div class="brand">
    <div class="brand-logo">RP</div>
    <div class="brand-text">
      <strong>Royal Palace</strong>
      <span>Hotel Management</span>
    </div>
  </div>

  <nav class="nav">

    <button onclick="goPage('dashboard.html')">
      <span class="nav-icon">▦</span>
      <span>Dashboard</span>
    </button>

    <button class="active" onclick="goPage('rooms.html')">
      <span class="nav-icon">▣</span>
      <span>Room Management</span>
    </button>

    <button onclick="goPage('bookings.html')">
      <span class="nav-icon">▤</span>
      <span>Booking History</span>
    </button>

    <button onclick="goPage('hotel.html')">
      <span class="nav-icon">⌂</span>
      <span>Hotel Details</span>
    </button>

    <button onclick="goPage('photos.html')">
      <span class="nav-icon">▧</span>
      <span>Photos</span>
    </button>

    <button onclick="goPage('settings.html')">
      <span class="nav-icon">⚙</span>
      <span>Settings</span>
    </button>

  </nav>

  <button class="website-btn" onclick="goPage('index.html')">
    🌐 View Website
  </button>

</aside>

<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<!-- MAIN -->
<main class="main">

  <header class="topbar">
    <button
      class="menu-btn"
      id="menuButton"
      onclick="toggleSidebar()"
      aria-label="Open menu"
      aria-expanded="false"
    >☰</button>

    <div class="top-title">Room Management</div>

    <div class="profile">A</div>
  </header>

  <div class="content">

    <!-- HERO -->
    <section class="hero">
      <div>
        <h1>Manage Your Rooms</h1>
        <p>Add, edit and manage all rooms of Royal Palace Hotel.</p>
      </div>

      <button class="add-btn" onclick="openAddRoom()">
        ＋ Add New Room
      </button>
    </section>

    <!-- STATS -->
    <section class="stats">

      <div class="stat">
        <div class="stat-top">
          <div>
            <div class="stat-label">Total Rooms</div>
          </div>
          <div class="stat-icon">▣</div>
        </div>
        <div class="stat-number" id="totalRooms">0</div>
      </div>

      <div class="stat">
        <div class="stat-top">
          <div>
            <div class="stat-label">Available</div>
          </div>
          <div class="stat-icon">✓</div>
        </div>
        <div class="stat-number" id="availableRooms">0</div>
      </div>

      <div class="stat">
        <div class="stat-top">
          <div>
            <div class="stat-label">Booked</div>
          </div>
          <div class="stat-icon">♟</div>
        </div>
        <div class="stat-number" id="bookedRooms">0</div>
      </div>

      <div class="stat">
        <div class="stat-top">
          <div>
            <div class="stat-label">Maintenance</div>
          </div>
          <div class="stat-icon">⚒</div>
        </div>
        <div class="stat-number" id="maintenanceRooms">0</div>
      </div>

    </section>

    <!-- ROOMS -->
    <section class="section">

      <div class="section-head">
        <h2>All Rooms</h2>
        <span id="roomCountText">0 rooms</span>
      </div>

      <div class="rooms-grid" id="roomsGrid"></div>

    </section>

  </div>
</main>

<!-- MODAL -->
<div class="modal" id="roomModal">

  <div class="modal-box">

    <div class="modal-head">
      <h3 id="modalTitle">Add New Room</h3>
      <button class="close" onclick="closeRoomModal()">×</button>
    </div>

    <form class="form" id="roomForm" onsubmit="saveRoom(event)">

      <div class="form-row">

        <div class="form-group">
          <label>Room Number</label>
          <input
            type="text"
            id="roomNumber"
            placeholder="e.g. 101"
            required
          >
        </div>

        <div class="form-group">
          <label>Room Name</label>
          <input
            type="text"
            id="roomName"
            placeholder="e.g. Premium Room"
            required
          >
        </div>

      </div>

      <div class="form-row">

        <div class="form-group">
          <label>Price Per Night (₹)</label>
          <input
            type="number"
            id="roomPrice"
            min="0"
            placeholder="2500"
            required
          >
        </div>

        <div class="form-group">
          <label>Status</label>
          <select id="roomStatus">
            <option value="available">Available</option>
            <option value="booked">Booked</option>
            <option value="maintenance">Maintenance</option>
          </select>
        </div>

      </div>

      <div class="form-group">
        <label>Image URL</label>
        <input
          type="text"
          id="roomImage"
          placeholder="premium-room.jpg"
        >
      </div>

      <div class="modal-actions">
        <button
          type="button"
          class="cancel-btn"
          onclick="closeRoomModal()"
        >Cancel</button>

        <button type="submit" class="save-btn">
          Save Room
        </button>
      </div>

    </form>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* ==============================
   ROOM DATA
============================== */

const ROOM_KEY = "royal_palace_rooms";

let rooms = [];
let editingId = null;

const defaultRooms = [
  {
    id:"room_101",
    number:"101",
    name:"Premium Room",
    price:2500,
    status:"available",
    image:"premium-room.jpg"
  },
  {
    id:"room_102",
    number:"102",
    name:"Royal Suite",
    price:4500,
    status:"available",
    image:"royal-suite.jpg"
  },
  {
    id:"room_103",
    number:"103",
    name:"Royal Palace Suite",
    price:6500,
    status:"available",
    image:""
  }
];

/* ==============================
   BASIC HELPERS
============================== */

function $(id){
  return document.getElementById(id);
}

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function formatPrice(value){
  const number = Number(value) || 0;
  return number.toLocaleString("en-IN");
}

/* ==============================
   NAVIGATION
============================== */

function goPage(page){
  closeSidebar();

  setTimeout(function(){
    window.location.href = page;
  },30);
}

function toggleSidebar(){

  const sidebar = $("sidebar");
  const overlay = $("overlay");
  const menuButton = $("menuButton");

  if(!sidebar || !overlay) return;

  const isOpen = sidebar.classList.contains("open");

  if(isOpen){
    closeSidebar();
  }else{
    sidebar.classList.add("open");
    overlay.classList.add("show");

    if(menuButton){
      menuButton.setAttribute("aria-expanded","true");
    }
  }
}

function closeSidebar(){

  const sidebar = $("sidebar");
  const overlay = $("overlay");
  const menuButton = $("menuButton");

  if(sidebar){
    sidebar.classList.remove("open");
  }

  if(overlay){
    overlay.classList.remove("show");
  }

  if(menuButton){
    menuButton.setAttribute("aria-expanded","false");
  }
}

/* ==============================
   STORAGE
============================== */

function saveRooms(){

  try{
    localStorage.setItem(
      ROOM_KEY,
      JSON.stringify(rooms)
    );
  }catch(error){
    console.error("Could not save rooms:",error);
  }
}

function loadRooms(){

  try{

    const saved = localStorage.getItem(ROOM_KEY);

    if(saved){

      const parsed = JSON.parse(saved);

      if(Array.isArray(parsed)){

        rooms = parsed.map(function(room,index){

          return {
            id:room.id || ("room_" + Date.now() + "_" + index),
            number:room.number || "",
            name:room.name || "Room",
            price:Number(room.price) || 0,
            status:room.status || "available",
            image:room.image || ""
          };

        });

      }else{
        rooms = JSON.parse(JSON.stringify(defaultRooms));
        saveRooms();
      }

    }else{

      rooms = JSON.parse(JSON.stringify(defaultRooms));
      saveRooms();

    }

  }catch(error){

    console.error("Room storage error:",error);

    rooms = JSON.parse(JSON.stringify(defaultRooms));
    saveRooms();

  }

  renderRooms();
}

/* ==============================
   STATS
============================== */

function updateStats(){

  const total = rooms.length;

  const available = rooms.filter(function(room){
    return room.status === "available";
  }).length;

  const booked = rooms.filter(function(room){
    return room.status === "booked";
  }).length;

  const maintenance = rooms.filter(function(room){
    return room.status === "maintenance";
  }).length;

  $("totalRooms").textContent = total;
  $("availableRooms").textContent = available;
  $("bookedRooms").textContent = booked;
  $("maintenanceRooms").textContent = maintenance;

  $("roomCountText").textContent =
    total + (total === 1 ? " room" : " rooms");
}

/* ==============================
   ROOM MENU
============================== */

function closeRoomMenus(){

  document.querySelectorAll(".room-menu").forEach(function(menu){
    menu.classList.remove("show");
  });

}

function toggleRoomMenu(id){

  const menu = document.getElementById("menu_" + id);

  if(!menu) return;

  const wasOpen = menu.classList.contains("show");

  closeRoomMenus();

  if(!wasOpen){
    menu.classList.add("show");
  }
}

/* ==============================
   RENDER ROOMS
============================== */

function renderRooms(){

  const grid = $("roomsGrid");

  if(!grid) return;

  closeRoomMenus();

  if(!rooms.length){

    grid.innerHTML = `
      <div class="empty">
        <div style="font-size:40px;margin-bottom:10px">🏨</div>
        <strong>No rooms found</strong>
        <div style="margin-top:6px">
          Add your first room using the button above.
        </div>
      </div>
    `;

    updateStats();
    return;
