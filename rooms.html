<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Royal Palace Hotel - Room Management</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100%}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f6fa;
  color:#111827;
}
button,input,select,textarea{font-family:inherit}

/* SIDEBAR */
.sidebar{
  position:fixed;
  left:0;top:0;bottom:0;
  width:250px;
  background:#111827;
  color:#fff;
  z-index:1000;
  display:flex;
  flex-direction:column;
  transition:transform .25s ease;
}
.logo-area{
  height:82px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 22px;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.logo{
  width:42px;height:42px;
  border-radius:50%;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#7c3aed;
  font-size:21px;
  font-weight:800;
}
.logo-text{font-size:18px;font-weight:700;line-height:1.1}
.logo-sub{
  display:block;
  color:#9ca3af;
  font-size:11px;
  font-weight:400;
  margin-top:4px;
}
.nav{padding:22px 14px;flex:1}
.nav-title{
  color:#6b7280;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1px;
  padding:0 12px 10px;
}
.nav-btn{
  width:100%;
  border:0;
  background:transparent;
  color:#cbd5e1;
  padding:13px 14px;
  border-radius:9px;
  display:flex;
  align-items:center;
  gap:13px;
  font-size:14px;
  text-align:left;
  cursor:pointer;
  margin-bottom:5px;
}
.nav-btn:hover{background:#1f2937;color:#fff}
.nav-btn.active{background:#7c3aed;color:#fff}
.nav-icon{width:22px;text-align:center;font-size:17px}
.sidebar-bottom{
  padding:14px;
  border-top:1px solid rgba(255,255,255,.08);
}
.website-btn{
  width:100%;
  border:1px solid rgba(255,255,255,.12);
  background:#1f2937;
  color:#fff;
  border-radius:9px;
  padding:12px;
  cursor:pointer;
  font-size:13px;
}

/* MAIN */
.main{margin-left:250px;min-height:100vh}

/* TOPBAR */
.topbar{
  height:82px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 30px;
  position:sticky;
  top:0;
  z-index:800;
}
.top-left{display:flex;align-items:center;gap:15px}
.menu-button{
  display:none;
  width:42px;height:42px;
  border:1px solid #e5e7eb;
  background:#fff;
  border-radius:9px;
  cursor:pointer;
  font-size:23px;
  color:#374151;
}
.page-title{font-size:20px;font-weight:700;color:#111827}
.page-subtitle{color:#9ca3af;font-size:12px;margin-top:4px}
.profile{
  width:42px;height:42px;
  border-radius:50%;
  background:#7c3aed;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
}

/* CONTENT */
.content{padding:30px}

/* HERO */
.hero{
  background:linear-gradient(135deg,#7c3aed,#5b21b6);
  color:#fff;
  border-radius:15px;
  padding:27px 30px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  margin-bottom:25px;
  box-shadow:0 8px 25px rgba(91,33,182,.15);
}
.hero h1{margin:0;font-size:25px}
.hero p{
  margin:8px 0 0;
  color:#e9d5ff;
  font-size:13px;
}
.add-room-btn{
  border:0;
  background:#fff;
  color:#6d28d9;
  border-radius:9px;
  padding:12px 18px;
  font-weight:700;
  font-size:13px;
  cursor:pointer;
  white-space:nowrap;
  box-shadow:0 4px 12px rgba(0,0,0,.12);
}

/* STATS */
.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
  margin-bottom:25px;
}
.stat-card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:13px;
  padding:20px;
  display:flex;
  align-items:center;
  gap:15px;
}
.stat-icon{
  width:46px;height:46px;
  border-radius:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  background:#f3e8ff;
  color:#7c3aed;
}
.stat-label{color:#6b7280;font-size:12px;margin-bottom:6px}
.stat-value{color:#111827;font-size:24px;font-weight:800}

/* SECTION */
.section{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
}
.section-header{
  padding:20px 22px;
  border-bottom:1px solid #e5e7eb;
}
.section-title{font-size:17px;font-weight:700}
.section-sub{color:#9ca3af;font-size:12px;margin-top:4px}

/* ROOM GRID */
.room-grid{
  padding:22px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}
.room-card{
  border:1px solid #e5e7eb;
  border-radius:13px;
  background:#fff;
  position:relative;
  transition:.2s;
}
.room-card:hover{
  box-shadow:0 8px 24px rgba(17,24,39,.08);
  transform:translateY(-2px);
}
.room-image{
  width:100%;
  height:185px;
  background:#eef2f7;
  border-radius:13px 13px 0 0;
  overflow:hidden;
  position:relative;
}
.room-image img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.no-image{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  color:#9ca3af;
  gap:8px;
}
.no-image-icon{font-size:34px}
.room-status{
  position:absolute;
  top:12px;
  left:12px;
  padding:5px 9px;
  border-radius:20px;
  font-size:10px;
  font-weight:700;
  text-transform:uppercase;
  background:#dcfce7;
  color:#15803d;
}
.room-status.occupied{background:#fee2e2;color:#dc2626}
.room-status.maintenance{background:#fef3c7;color:#b45309}
.room-body{padding:17px}
.room-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
}
.room-name{font-size:17px;font-weight:700;color:#111827}
.room-number{color:#9ca3af;font-size:12px;margin-top:5px}
.room-price{
  color:#7c3aed;
  font-size:17px;
  font-weight:800;
  white-space:nowrap;
}
.room-price span{font-size:10px;color:#9ca3af;font-weight:400}
.room-details{
  display:flex;
  gap:15px;
  margin-top:15px;
  padding-top:13px;
  border-top:1px solid #f1f5f9;
  color:#6b7280;
  font-size:11px;
}
.room-detail{display:flex;gap:5px;align-items:center}

/* THREE DOT */
.room-actions{position:relative}
.dots-btn{
  width:32px;height:32px;
  border:0;
  background:#f3f4f6;
  border-radius:8px;
  cursor:pointer;
  font-size:18px;
  color:#4b5563;
  display:flex;
  align-items:center;
  justify-content:center;
}
.action-menu{
  position:absolute;
  right:0;
  top:38px;
  width:160px;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:9px;
  box-shadow:0 10px 30px rgba(0,0,0,.13);
  z-index:600;
  display:none;
  overflow:hidden;
}
.action-menu.show{display:block}
.action-item{
  width:100%;
  padding:11px 13px;
  border:0;
  background:#fff;
  text-align:left;
  cursor:pointer;
  font-size:12px;
  color:#374151;
}
.action-item:hover{background:#f5f3ff;color:#6d28d9}
.action-item.delete{color:#dc2626}
.action-item.delete:hover{background:#fef2f2;color:#b91c1c}

/* EMPTY */
.empty-state{
  padding:55px 20px;
  text-align:center;
  color:#9ca3af;
}
.empty-icon{font-size:45px;margin-bottom:12px}
.empty-state h3{margin:0 0 7px;color:#374151;font-size:17px}
.empty-state p{margin:0;font-size:12px}

/* MODAL */
.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.62);
  z-index:2000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.modal-overlay.show{display:flex}
.modal{
  width:100%;
  max-width:570px;
  max-height:92vh;
  overflow-y:auto;
  background:#fff;
  border-radius:15px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}
.modal-header{
  padding:20px 22px;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.modal-title{font-size:18px;font-weight:700}
.close-btn{
  width:34px;height:34px;
  border:0;
  border-radius:8px;
  background:#f3f4f6;
  color:#4b5563;
  cursor:pointer;
  font-size:20px;
}
.modal-body{padding:22px}
.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:17px;
}
.form-group.full{grid-column:1/-1}
.form-label{
  display:block;
  font-size:12px;
  font-weight:700;
  color:#374151;
  margin-bottom:7px;
}
.form-control{
  width:100%;
  height:44px;
  border:1px solid #d1d5db;
  border-radius:8px;
  padding:0 12px;
  outline:none;
  font-size:13px;
  color:#111827;
  background:#fff;
}
.form-control:focus{
  border-color:#7c3aed;
  box-shadow:0 0 0 3px rgba(124,58,237,.1);
}
textarea.form-control{height:90px;padding:12px;resize:vertical}
.modal-footer{
  padding:17px 22px;
  border-top:1px solid #e5e7eb;
  display:flex;
  justify-content:flex-end;
  gap:10px;
}
.cancel-btn,.save-btn{
  border:0;
  border-radius:8px;
  padding:11px 18px;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
}
.cancel-btn{background:#f3f4f6;color:#374151}
.save-btn{background:#7c3aed;color:#fff}

/* TOAST */
.toast{
  position:fixed;
  right:25px;
  bottom:25px;
  background:#111827;
  color:#fff;
  padding:13px 17px;
  border-radius:9px;
  font-size:12px;
  box-shadow:0 8px 25px rgba(0,0,0,.2);
  transform:translateY(100px);
  opacity:0;
  pointer-events:none;
  transition:.3s;
  z-index:3000;
}
.toast.show{transform:translateY(0);opacity:1}

/* MOBILE */
@media(max-width:1100px){
  .room-grid{grid-template-columns:repeat(2,1fr)}
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:800px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .menu-button{
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .topbar{height:70px;padding:0 15px}
  .content{padding:18px 14px}
  .hero{
    padding:21px 18px;
    align-items:flex-start;
    flex-direction:column;
  }
  .hero h1{font-size:21px}
  .add-room-btn{width:100%}
  .room-grid{
    grid-template-columns:1fr;
    padding:15px;
  }
  .stats{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .stat-card{padding:14px;gap:10px}
  .stat-icon{width:38px;height:38px;font-size:17px}
  .stat-value{font-size:20px}
  .form-grid{grid-template-columns:1fr}
  .form-group.full{grid-column:auto}
}
@media(max-width:480px){
  .page-title{font-size:16px}
  .stats{grid-template-columns:1fr 1fr}
  .stat-label{font-size:10px}
  .stat-value{font-size:18px}
  .modal-footer{flex-direction:column-reverse}
  .cancel-btn,.save-btn{width:100%}
  .toast{left:15px;right:15px;bottom:15px;text-align:center}
}
</style>
</head>

<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">

  <div class="logo-area">
    <div class="logo">H</div>
    <div>
      <div class="logo-text">Royal Palace</div>
      <span class="logo-sub">Hotel Management</span>
    </div>
  </div>

  <nav class="nav">

    <div class="nav-title">Main Menu</div>

    <button class="nav-btn" type="button" data-page="dashboard.html">
      <span class="nav-icon">▦</span>
      <span>Dashboard</span>
    </button>

    <button class="nav-btn active" type="button">
      <span class="nav-icon">▣</span>
      <span>Room Management</span>
    </button>

    <button class="nav-btn" type="button" data-page="bookings.html">
      <span class="nav-icon">▤</span>
      <span>Booking History</span>
    </button>

    <button class="nav-btn" type="button" data-page="hotel.html">
      <span class="nav-icon">⌂</span>
      <span>Hotel Details</span>
    </button>

    <button class="nav-btn" type="button" data-page="photos.html">
      <span class="nav-icon">▧</span>
      <span>Photos</span>
    </button>

    <button class="nav-btn" type="button" data-page="settings.html">
      <span class="nav-icon">⚙</span>

<!-- MAIN -->
<main class="main">

  <header class="topbar">

    <div class="top-left">

      <button
        class="menu-button"
        id="menuButton"
        type="button"
        aria-expanded="false"
      >☰</button>

      <div>
        <div class="page-title">Room Management</div>
        <div class="page-subtitle">
          Manage hotel rooms and availability
        </div>
      </div>

    </div>

    <div class="profile">A</div>

  </header>

  <section class="content">

    <!-- HERO -->
    <div class="hero">

      <div>
        <h1>Room Management</h1>
        <p>
          Add, edit and manage all rooms in your Royal Palace Hotel.
        </p>
      </div>

      <button
        class="add-room-btn"
        type="button"
        id="addRoomButton"
      >

      </button>

    </div>

    <!-- STATS -->
    <div class="stats">

      <div class="stat-card">
        <div class="stat-icon">▣</div>
        <div>
          <div class="stat-label">Total Rooms</div>
          <div class="stat-value" id="totalRooms">0</div>

    <div class="section">

      <div class="section-header">

        <div>

      </div>

      <div class="room-grid" id="roomGrid"></div>

    </div>

  </section>

</main>

<!-- MODAL -->
<div class="modal-overlay" id="roomModal">

  <div class="modal">

    <div class="modal-header">

      <div class="modal-title" id="modalTitle">
        Add New Room
      </div>

      <button
        class="close-btn"
        type="button"
        id="closeModalButton"

    </div>

    <form id="roomForm">

      <div class="modal-body">

              Room Name
            </label>

            <input

              id="roomName"
              type="text"

            <label class="form-label">
              Bed Type
            </label>

            <select class="form-control" id="roomBed">

              <option>Double Bed</option>
              <option>Single Bed</option>
              <option>Twin Beds</option>
            </select>

          </div>

          <div class="form-group">

            <label class="form-label">
              Guests
            </label>

            <select class="form-control" id="roomGuests">
              <option>2 Guests</option>
              <option>3 Guests</option>
              <option>4 Guests</option>
              <option>5 Guests</option>
              <option>6 Guests</option>
            </select>

          </div>

          <div class="form-group full">

            <label class="form-label">
              Room Image URL
            </label>

            <input
              class="form-control"
              id="roomImage"
              type="text"
              placeholder="premium-room.jpg or image URL"
            >

          </div>

          <div class="form-group full">

            <label class="form-label">
              Description
            </label>

            <textarea
              class="form-control"
              id="roomDescription"
              placeholder="Enter room description..."
            ></textarea>

          </div>

        </div>

      </div>

      <div class="modal-footer">

        <button
          class="cancel-btn"
          type="button"
          id="cancelModalButton"
        >
          Cancel
        </button>

        <button
          class="save-btn"
          type="submit"
        >
          Save Room
        </button>

      </div>

    </form>

  </div>

</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
"use strict";

/* =========================
   STORAGE
========================= */

const ROOM_KEY = "royal_palace_rooms";

let rooms = [];
let editingId = null;

/* DEFAULT ROOMS */

const defaultRooms = [
  {
    id:"room_101",
    number:"101",
    name:"Premium Room",
    price:2500,
    status:"available",
    bed:"King Bed",
    guests:"2 Guests",
    image:"premium-room.jpg",
    description:"Elegant premium room with modern facilities."
  },
  {
    id:"room_102",
    number:"102",
    name:"Royal Suite",
    price:4500,
    status:"available",
    bed:"King Bed",
    guests:"3 Guests",
    image:"royal-suite.jpg",
    description:"Luxury Royal Suite with premium comfort."
  },
  {
    id:"room_103",
    number:"103",
    name:"Royal Palace Suite",
    price:6500,
    status:"available",
    bed:"King Bed",
    guests:"4 Guests",
    image:"",
    description:"Spacious luxury suite for a premium stay."
  }
];

/* =========================
   HELPERS
========================= */

function $(id){
  return document.getElementById(id);
}

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

/* =========================
   SAVE / LOAD
========================= */

function saveRooms(){
  localStorage.setItem(ROOM_KEY,JSON.stringify(rooms));
}

function loadRooms(){

  try{

    const saved = localStorage.getItem(ROOM_KEY);

    if(saved){

      const parsed = JSON.parse(saved);

      if(Array.isArray(parsed)){
        rooms = parsed;
      }else{
        rooms = [...defaultRooms];
        saveRooms();
      }

    }else{

      rooms = [...defaultRooms];
      saveRooms();

    }

  }catch(error){

    rooms = [...defaultRooms];
    saveRooms();

  }

  renderRooms();
  updateStats();
}

/* =========================
   STATS
========================= */

function updateStats(){

  $("totalRooms").textContent = rooms.length;

  $("availableRooms").textContent =
    rooms.filter(r => r.status === "available").length;

  $("occupiedRooms").textContent =
    rooms.filter(r => r.status === "occupied").length;

  const types = new Set(
    rooms.map(r => String(r.name || "").trim().toLowerCase())
  );

  $("roomTypes").textContent = types.size;
}

/* =========================
   ROOM RENDER
========================= */

function renderRooms(){

  const grid = $("roomGrid");

  if(!grid) return;

  if(!rooms.l
