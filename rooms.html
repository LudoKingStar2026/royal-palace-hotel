<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Royal Palace Hotel - Room Management</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#111827;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.sidebar{
  position:fixed;
  left:0;
  top:0;
  width:250px;
  height:100vh;
  background:#11152f;
  color:white;
  z-index:1000;
  display:flex;
  flex-direction:column;
  box-shadow:4px 0 20px rgba(0,0,0,.08);
}

.brand{
  height:82px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 22px;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.brand-logo{
  width:42px;
  height:42px;
  border-radius:12px;
  background:linear-gradient(135deg,#8b5cf6,#6d28d9);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
  font-weight:800;
}

.brand-text strong{
  display:block;
  font-size:15px;
  letter-spacing:.3px;
}

.brand-text span{
  display:block;
  margin-top:3px;
  font-size:11px;
  color:#aeb4d0;
}

.nav{
  padding:18px 12px;
  flex:1;
}

.nav button{
  width:100%;
  border:0;
  background:transparent;
  color:#aeb4d0;
  padding:13px 15px;
  margin-bottom:6px;
  border-radius:10px;
  display:flex;
  align-items:center;
  gap:12px;
  text-align:left;
  transition:.2s;
}

.nav button:hover{
  background:#1d2244;
  color:white;
}

.nav button.active{
  background:#7047e8;
  color:white;
  box-shadow:0 8px 18px rgba(112,71,232,.25);
}

.nav-icon{
  width:22px;
  text-align:center;
  font-size:17px;
}

.sidebar-bottom{
  padding:14px 12px 18px;
  border-top:1px solid rgba(255,255,255,.08);
}

.website-btn{
  width:100%;
  border:1px solid rgba(255,255,255,.12);
  background:#181d3b;
  color:#fff;
  padding:12px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}

.main{
  margin-left:250px;
  min-height:100vh;
}

.topbar{
  height:82px;
  background:#fff;
  border-bottom:1px solid #e8eaf0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 30px;
  position:sticky;
  top:0;
  z-index:500;
}

.top-left{
  display:flex;
  align-items:center;
  gap:14px;
}

.menu-btn{
  display:none;
  width:42px;
  height:42px;
  border:1px solid #e5e7eb;
  background:#fff;
  border-radius:10px;
  font-size:21px;
}

.page-title{
  font-size:20px;
  font-weight:800;
  color:#171b36;
}

.top-right{
  display:flex;
  align-items:center;
  gap:12px;
}

.profile{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#7047e8;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  box-shadow:0 5px 15px rgba(112,71,232,.25);
}

.content{
  padding:30px;
}

.hero{
  background:linear-gradient(135deg,#7047e8,#7c3aed);
  color:#fff;
  border-radius:18px;
  padding:27px 28px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  box-shadow:0 12px 28px rgba(112,71,232,.18);
}

.hero h1{
  margin:0 0 8px;
  font-size:26px;
}

.hero p{
  margin:0;
  color:#eee9ff;
  font-size:14px;
}

.add-btn{
  border:0;
  background:#fff;
  color:#6335d5;
  padding:12px 18px;
  border-radius:10px;
  font-weight:800;
  box-shadow:0 7px 15px rgba(0,0,0,.12);
}

.add-btn:hover{
  transform:translateY(-1px);
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
  margin:24px 0;
}

.stat{
  background:#fff;
  border:1px solid #e9ebf2;
  border-radius:15px;
  padding:20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.stat-info span{
  display:block;
  font-size:13px;
  color:#747b91;
  margin-bottom:7px;
}

.stat-info strong{
  font-size:27px;
  color:#151932;
}

.stat-icon{
  width:48px;
  height:48px;
  border-radius:13px;
  background:#f0ebff;
  color:#7047e8;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.section-head h2{
  margin:0;
  font-size:19px;
  color:#171b36;
}

.section-head span{
  color:#73798e;
  font-size:13px;
}

.room-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:20px;
}

.room-card{
  background:#fff;
  border:1px solid #e8eaf0;
  border-radius:17px;
  overflow:hidden;
  position:relative;
  transition:.2s;
}

.room-card:hover{
  transform:translateY(-3px);
  box-shadow:0 12px 28px rgba(20,24,50,.08);
}

.room-image{
  height:190px;
  background:#eceff5;
  position:relative;
  overflow:hidden;
}

.room-image img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.no-image{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#8a90a3;
  font-size:45px;
}

.status{
  position:absolute;
  left:14px;
  top:14px;
  padding:6px 10px;
  border-radius:20px;
  font-size:11px;
  font-weight:800;
  text-transform:capitalize;
  background:#fff;
  box-shadow:0 4px 12px rgba(0,0,0,.12);
}

.status.available{
  color:#16834b;
}

.status.booked{
  color:#c23b3b;
}

.status.maintenance{
  color:#a06a00;
}

.more{
  position:absolute;
  right:12px;
  top:12px;
  width:36px;
  height:36px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.95);
  color:#30364d;
  font-size:20px;
  z-index:5;
}

.room-menu{
  position:absolute;
  right:12px;
  top:54px;
  width:155px;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:10px;
  box-shadow:0 12px 30px rgba(0,0,0,.15);
  padding:6px;
  display:none;
  z-index:20;
}

.room-menu.show{
  display:block;
}

.room-menu button{
  width:100%;
  border:0;
  background:#fff;
  padding:10px;
  border-radius:7px;
  text-align:left;
  color:#252a40;
}

.room-menu button:hover{
  background:#f4f5f8;
}

.room-menu button.delete{
  color:#dc2626;
}

.room-body{
  padding:18px;
}

.room-name{
  font-size:18px;
  font-weight:800;
  color:#171b36;
  margin-bottom:5px;
}

.room-number{
  font-size:13px;
  color:#7a8093;
  margin-bottom:16px;
}

.room-footer{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding-top:14px;
  border-top:1px solid #edf0f4;
}

.price strong{
  color:#171b36;
  font-size:18px;
}

.price span{
  color:#81879a;
  font-size:12px;
}

.edit-small{
  border:1px solid #ddd6fe;
  background:#f6f3ff;
  color:#7047e8;
  padding:8px 12px;
  border-radius:8px;
  font-size:12px;
  font-weight:700;
}

.empty{
  grid-column:1/-1;
  background:#fff;
  border:1px dashed #d6d9e2;
  border-radius:16px;
  padding:50px 20px;
  text-align:center;
  color:#777e92;
}

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:900;
}

.overlay.show{
  display:block;
}

/* Modal */
.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(10,13,30,.6);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:2000;
}

.modal-backdrop.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:540px;
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:18px;
  box-shadow:0 25px 70px rgba(0,0,0,.25);
}

.modal-head{
  padding:20px 22px;
  border-bottom:1px solid #eceef3;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.modal-head h3{
  margin:0;
  font-size:20px;
  color:#171b36;
}

.close-btn{
  width:36px;
  height:36px;
  border:0;
  background:#f2f3f7;
  border-radius:50%;
  font-size:20px;
  color:#555b70;
}

.modal-body{
  padding:22px;
}

.form-group{
  margin-bottom:16px;
}

.form-group label{
  display:block;
  font-size:13px;
  font-weight:700;
  color:#444a60;
  margin-bottom:7px;
}

.form-group input,
.form-group select{
  width:100%;
  border:1px solid #dfe2e9;
  border-radius:9px;
  padding:12px 13px;
  outline:none;
  background:#fff;
  color:#1b1f34;
}

.form-group input:focus,
.form-group select:focus{
  border-color:#7047e8;
  box-shadow:0 0 0 3px rgba(112,71,232,.1);
}

.form-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.modal-footer{
  padding:16px 22px 22px;
  display:flex;
  justify-content:flex-end;
  gap:10px;
}

.cancel-btn{
  border:1px solid #dfe2e9;
  background:#fff;
  color:#4e556b;
  padding:11px 17px;
  border-radius:9px;
  font-weight:700;
}

.save-btn{
  border:0;
  background:#7047e8;
  color:#fff;
  padding:11px 19px;
  border-radius:9px;
  font-weight:800;
}

.toast{
  position:fixed;
  right:25px;
  bottom:25px;
  background:#171b36;
  color:#fff;
  padding:13px 17px;
  border-radius:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
  transform:translateY(100px);
  opacity:0;
  pointer-events:none;
  transition:.3s;
  z-index:3000;
  font-size:13px;
}

.toast.show{
  transform:translateY(0);
  opacity:1;
}

/* Mobile */
@media(max-width:1000px){
  .room-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

@media(max-width:800px){
  .sidebar{
    transform:translateX(-100%);
    transition:.25s;
    width:250px;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    margin-left:0;
  }

  .menu-btn{
    display:block;
  }

  .topbar{
    padding:0 16px;
    height:70px;
  }

  .content{
    padding:18px;
  }

  .hero{
    padding:22px;
    align-items:flex-start;
    flex-direction:column;
  }

  .hero h1{
    font-size:23px;
  }

  .stats{
    grid-template-columns:1fr;
    gap:12px;
  }

  .room-grid{
    grid-template-columns:1fr;
  }
}

@media(max-width:520px){
  .page-title{
    font-size:17px;
  }

  .profile{
    width:38px;
    height:38px;
  }

  .hero{
    border-radius:14px;
  }

  .hero h1{
    font-size:21px;
  }

  .add-btn{
    width:100%;
  }

  .form-row{
    grid-template-columns:1fr;
    gap:0;
  }

  .modal-backdrop{
    padding:10px;
  }

  .modal{
    border-radius:14px;
  }

  .toast{
    left:15px;
    right:15px;
    bottom:15px;
    text-align:center;
  }
}
</style>
</head>

        type="button"

<div class="toast" id="toast"></div>

<script>
"use strict";

/* =========================
   STORAGE
========================= */

const ROOM_KEY = "royal_palace_rooms";

let rooms = [];
let editingId = null;

/* =========================
   DEFAULT ROOMS
========================= */

const defaultRooms = [
  {
    id: "room_101",
    name: "Premium Room",
    number: "101",
    price: 2500,
    status: "available",
    image: "premium-room.jpg"
  },
  {
    id: "room_102",
    name: "Royal Suite",
    number: "102",
    price: 4500,
    status: "available",
    image: "royal-suite.jpg"
  },
  {
    id: "room_103",
    name: "Royal Palace Suite",
    number: "103",
    price: 6500,
    status: "available",
    image: ""
  }
];

/* =========================
   HELPERS
========================= */

function $(id){
  return document.getElementById(id);
}

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function createId(){
  return "room_" + Date.now() + "_" + Math.random()
    .toString(36)
    .substring(2,8);
}

/* =========================
   NAVIGATION
========================= */

function goPage(page){
  closeSidebar();

  setTimeout(function(){
    window.location.href = page;
  },30);
}

/* =========================
   SIDEBAR
========================= */

function toggleSidebar(){

  const sidebar = $("sidebar");
  const overlay = $("overlay");
  const menuButton = $("menuButton");

  if(!sidebar || !overlay){
    return;
  }

  const isOpen = sidebar.classList.contains("open");

  if(isOpen){
    closeSidebar();
  }else{
    sidebar.classList.add("open");
    overlay.classList.add("show");

    if(menuButton){
      menuButton.setAttribute("aria-expanded","true");
    }
  }
}

function closeSidebar(){

  const sidebar = $("sidebar");
  const overlay = $("overlay");
  const menuButton = $("menuButton");

  if(sidebar){
    sidebar.classList.remove("open");
  }

  if(overlay){
    overlay.classList.remove("show");
  }

  if(menuButton){
    menuButton.setAttribute("aria-expanded","false");
  }
}

/* =========================
   LOAD / SAVE ROOMS
========================= */

function saveRooms(){

  localStorage.setItem(
    ROOM_KEY,
    JSON.stringify(rooms)
  );
}

function loadRooms(){

  try{

    const saved = localStorage.getItem(ROOM_KEY);

    if(saved){

      const parsed = JSON.parse(saved);

      if(Array.isArray(parsed)){
        rooms = parsed;
      }else{
        rooms = [...defaultRooms];
        saveRooms();
      }

    }else{

      rooms = [...defaultRooms];
      saveRooms();

    }

  }catch(error){

    console.error("Room loading error:",error);

    rooms = [...defaultRooms];
    saveRooms();
  }

  updateStats();
  renderRooms();
}

/* =========================
   STATS
========================= */

function updateStats(){

  const total = rooms.length;

  const available = rooms.filter(function(room){
    return room.status === "available";
  }).length;

  const booked = rooms.filter(function(room){
    return room.status === "booked";
  }).length;

  $("totalRooms").textContent = total;
  $("availableRooms").textContent = available;
  $("bookedRooms").textContent = booked;

  $("roomCountText").textContent =
    total + (total === 1 ? " room" : " rooms");
}

/* =========================
   CLOSE ROOM MENUS
========================= */

function closeRoomMenus(exceptId){

  document.querySelectorAll(".room-menu.show").forEach(function(menu){

    if(exceptId && menu.id === "roomMenu_" + exceptId){
      return;
    }

    menu.classList.remove("show");
  });
}

/* =========================
   TOGGLE ROOM MENU
========================= */

function toggleRoomMenu(id){

  const menu = $("roomMenu_" + id);

  if(!menu){
    return;
  }

  const wasOpen = menu.classList.contains("show");

  closeRoomMenus();

  if(!wasOpen){
    menu.classList.add("show");
  }
}

/* =========================
   RENDER ROOMS
========================= */

function renderRooms(){

  const grid = $("roomGrid");

  if(!grid){
    return;
  }

  if(!rooms.length){
