<html lang="en">

<style>

body{

.nav-icon{

.sidebar-bottom{

.website-btn{

.main{

.topbar{

.page-title h1{

.profile{

.menu-button{

height:42px;

.content{

.hero{

.add-btn{

}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);

}

.stat-card{
background:#fff;
border:1px solid #edf0f6;
border-radius:14px;

}

.stat-icon{
width:40px;
height:40px;
border-radius:10px;
display:flex;
align-items:center;

}

.stat-number{

}

.section-head{
display:flex;

.section-head h2{

}

.room-count{

.room-card{

}

.room-image img{

.no-image{

}

.status{

.status.occupied{color:#d33c3c}
.status.maintenance{color:#b06b00}

.room-info{

}

.room-name{

}

.room-number{
font-size:11px;
color:#929bad;
margin-bottom:14px;
}

.room-bottom{

justify-content:space-between;
align-items:center;
}

.price{

.price span{

}

.capacity{

color:#81899d;
}

.dots-btn{

right:13px;
top:188px;
width:32px;
height:32px;
border:0;

}

.action-menu{
position:absolute;
right:13px;
top:226px;
width:170px;
background:#fff;
border:1px solid #e7eaf1;
border-radius:10px;
padding:6px;
box-shadow:0 15px 35px rgba(30,40,70,.15);
z-index:200;
display:none;
}

.action-menu.show{
display:block;
}

.action-menu button{
width:100%;
border:0;
background:#fff;
text-align:left;
padding:10px;
border-radius:7px;
font-size:12px;
color:#374151;
cursor:pointer;
}

.action-menu button:hover{
background:#f5f3ff;
}

.action-menu .delete-option{

.empty{

border:1px dashed #d9deea;
border-radius:15px;
padding:50px 20px;
text-align:center;
color:#8d96aa;

}

.empty-icon{
font-size:42px;
margin-bottom:10px;
}

color:#4a5367;

.modal-overlay{
position:fixed;
inset:0;
background:rgba(8,17,40,.58);
display:none;
align-items:center;
justify-content:center;
padding:20px;
z-index:3000;
}

.modal-overlay.show{
display:flex;
}

.modal{

max-width:520px;
max-height:90vh;
overflow-y:auto;

}

.modal-header{

border-bottom:1px solid #edf0f5;

align-items:center;
justify-content:space-between;

.modal-header h2{
font-size:18px;
}

.close-modal{
width:34px;
height:34px;
border:0;
border-radius:8px;
background:#f4f5f8;
cursor:pointer;
font-size:20px;
}

.form{
padding:22px;
}

.form-group{
margin-bottom:16px;
}

.form-group label{
display:block;
font-size:12px;
font-weight:700;
color:#50596b;
margin-bottom:7px;
}

.form-group input,
.form-group select{
width:100%;
height:43px;
border:1px solid #dfe4ed;
border-radius:8px;
padding:0 12px;
outline:none;
font-size:13px;
background:#fff;
}

.form-row{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
}

.modal-footer{
display:flex;
justify-content:flex-end;
gap:10px;
padding:0 22px 22px;
}

.cancel-btn,
.save-btn{
border:0;
border-radius:8px;
padding:11px 18px;
font-size:12px;
font-weight:700;
cursor:pointer;
}

.cancel-btn{
background:#f0f2f6;
color:#566074;
}

.save-btn{
background:#7445e8;
color:#fff;
}

.toast{
position:fixed;
left:50%;
bottom:25px;
transform:translate(-50%,20px);
background:#17213a;
color:#fff;
padding:12px 18px;
border-radius:9px;
font-size:12px;
opacity:0;
pointer-events:none;
transition:.25s;
z-index:5000;
}

.toast.show{
opacity:1;
transform:translate(-50%,0);
}

.sidebar-overlay{
display:none;
position:fixed;
inset:0;
background:rgba(4,10,25,.48);
z-index:900;
}

.sidebar-overlay.show{
display:block;
}

grid-template-columns:repeat(2,1fr);
}

}
}

}

.topbar{
height:70px;
padding:0 15px;
}

.menu-button{

}

.page-title h1{

}

.page-title p{
font-size:10px;
}

.profile{
width:36px;
height:36px;
}

.content{

}

.hero{
display:block;
padding:20px;
}

.hero h2{
font-size:20px;
}

.hero p{
margin-bottom:17px;
}

.add-btn{
width:100%;
}

.rooms-grid{
grid-template-columns:1fr;
}

.stats{
grid-template-columns:1fr 1fr;
gap:10px;
}

.stat-card{
padding:15px;
}

.stat-number{

}

.room-image{
height:190px;
}

.dots-btn{
top:203px;
}

.action-menu{
top:240px;
}

}

.form-row{
grid-template-columns:1fr;
gap:0;
}

}
</style>
</head>

<body>

<script>

var ROOM_KEY = "royal_palace_rooms";
var editingId = null;

var defaultRooms = [
{
id:"room_101",
number:"101",
name:"Premium Room",
price:2500,
capacity:"2 Guests",
status:"Available",
image:"premium-room.jpg"
},
{
id:"room_102",
number:"102",
name:"Royal Suite",
price:4500,
capacity:"3 Guests",
status:"Available",
image:"royal-suite.jpg"
},
{
id:"room_103",
number:"103",
name:"Royal Palace Suite",
price:6500,
capacity:"4 Guests",
status:"Available",
image:""
}
];

var rooms = [];


/* ================= NAVIGATION ================= */

function goPage(page){

closeSidebar();
closeAllMenus();

window.location.href = page;

}


/* ================= SIDEBAR ================= */

function toggleSidebar(){

var sidebar = document.getElementById("sidebar");
var overlay = document.getElementById("sidebarOverlay");
var button = document.getElementById("menuButton");

if(sidebar.classList.contains("open")){

closeSidebar();

}else{

sidebar.classList.add("open");
overlay.classList.add("show");

if(button){
button.setAttribute("aria-expanded","true");
}

}

}


function closeSidebar(){

var sidebar = document.getElementById("sidebar");
var overlay = document.getElementById("sidebarOverlay");
var button = document.getElementById("menuButton");

if(sidebar){
sidebar.classList.remove("open");
}

if(overlay){
overlay.classList.remove("show");
}

if(button){
button.setAttribute("aria-expanded","false");
}

}


/* ================= STORAGE ================= */

function saveRooms(){

try{

localStorage.setItem(
ROOM_KEY,
JSON.stringify(rooms)
);

}catch(error){

console.log(error);

}

}


function loadRooms(){

var saved = null;

try{
saved = localStorage.getItem(ROOM_KEY);
}catch(error){
saved = null;
}

if(saved){

try{

var parsed = JSON.parse(saved);

if(Array.isArray(parsed)){

rooms = parsed;

}else{

rooms = defaultRooms.slice();

}

}catch(error){

rooms = defaultRooms.slice();

}

}else{

rooms = defaultRooms.slice();
saveRooms();

}

renderRooms();
updateStats();

}


/* ================= ESCAPE ================= */

function esc(value){

return String(value == null ? "" : value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* ================= STATS ================= */

function updateStats(){

var total = rooms.length;
var available = 0;
var occupied = 0;
var maintenance = 0;

rooms.forEach(function(room){

var s = String(room.status || "").toLowerCase();

if(s === "available") available++;
if(s === "occupied") occupied++;
if(s === "maintenance") maintenance++;

});

document.getElementById("totalRooms").textContent = total;
document.getElementById("availableRooms").textContent = available;
document.getElementById("occupiedRooms").textContent = occupied;
document.getElementById("maintenanceRooms").textContent = maintenance;

document.getElementById("roomCount").textContent =
total === 1 ? "1 room" : total + " rooms";

}


/* ================= RENDER ================= */

function renderRooms(){

var grid = document.getElementById("roomsGrid");

grid.innerHTML = "";

if(rooms.length === 0){

grid.innerHTML =
'<div class="empty">' +
'<div class="empty-icon">🏨</div>' +
'<h3>No Rooms Found</h3>' +
'<p>Add your first room using the button above.</p>' +
'</div>';

return;

}


rooms.forEach(function(room){

var status = room.status || "Available";
var statusClass = status.toLowerCase();

var image = "";

if(room.image){

image =
'<img src="' +
esc(room.image) +
'" alt="' +
esc(room.name) +
'" onerror="this.style.display=\'none\'">';

}else{

image =
'<div class="no-image">🏨</div>';

}


var card = document.createElement("div");

card.className = "room-card";

card.innerHTML =

'<div class="room-image">' +

image +

'<div class="status ' +
esc(statusClass) +
'">' +
esc(status) +
'</div>' +

'</div>' +

'<button ' +
'type="button" ' +
'class="dots-btn" ' +
'data-id="' +
esc(room.id) +
'" ' +
'onclick="toggleRoomMenu(this,event)">' +
'⋮' +
'</button>' +

'<div class="action-menu" data-menu="' +
esc(room.id) +
'">' +

'<button type="button" onclick="editFromMenu(this,event)">' +
'✏️ &nbsp; Edit Room' +
'</button>' +

'<button type="button" onclick="duplicateFromMenu(this,event)">' +
'📋 &nbsp; Duplicate' +
'</button>' +

'<button type="button" class="delete-option" onclick="deleteFromMenu(this,event)">' +
'🗑️ &nbsp; Delete Room' +
'</button>' +

'</div>' +

'<div class="room-info">' +

'<div class="room-name">' +
esc(room.name) +
'</div>' +

'<div class="room-number">' +
'Room No. ' +
esc(room.number) +
'</div>' +

'<div class="room-bottom">' +

'<div class="price">' +
'₹' +
Number(room.price || 0).toLocaleString("en-IN") +
' <span>/ night</span>' +
'</div>' +

'<div class="capacity">' +
'👤 ' +
esc(room.capacity || "2 Guests") +
'</div>' +

'</div>' +

'</div>';

grid.appendChild(card);

});

}


/* ================= THREE DOT ================= */

function closeAllMenus(){

var menus = document.querySelectorAll(".action-menu");

for(var i=0;i<menus.length;i++){
menus[i].classList.remove("show");
}

}


function toggleRoomMenu(button,event){

if(event){
event.stopPropagation();
}

var id = button.getAttribute("data-id");

var menus = document.querySelectorAll(".action-menu");

for(var i=0;i<menus.length;i++){

var menu = menus[i];

if(menu.getAttribute("data-menu") === id){

var open = menu.classList.contains("show");

closeAllMenus();

if(!open){
menu.classList.add("show");
}

}

}

}


/* ================= GET ROOM ID ================= */

function getIdFromButton(button){

var card = button.closest(".room-card");

if(!card){
return null;
}

var dot = card.querySelector(".dots-btn");

if(!dot){
return null;
}

return dot.getAttribute("data-id");

}


/* ================= EDIT ================= */

function editFromMenu(button,event){

if(event){
event.stopPropagation();
}

var id = getIdFromButton(button);

if(id){

function editRoom(id){

var room = null;

rooms.forEach(function(item){

if(String(item.id) === String(id)){
room = item;
}

});

if(!room){
showToast("Room not found");
return;
}

editingId = id;

document.getElementById("modalTitle").textContent = "Edit Room";

document.getElementById("roomNumber").value = room.number || "";
document.getElementById("roomName").value = room.name || "";
document.getElementById("roomPrice").value = room.price || "";
document.getElementById("roomCapacity").value = room.capacity || "2 Guests";
document.getElementById("roomStatus").value = room.status || "Available";
document.getElementById("roomImage").value = room.image || "";

closeAllMenus();

document.getElementById("roomModal").classList.add("show");

}
