<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0b1736">
<title>Royal Palace Hotel - Room Management</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  min-height:100%;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#182033;
}

/* ================= SIDEBAR ================= */

.sidebar{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:250px;
  background:#0b1736;
  color:#fff;
  z-index:1000;
  display:flex;
  flex-direction:column;
  transition:transform .25s ease;
}

.logo{
  height:82px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 22px;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.logo-icon{
  width:42px;
  height:42px;
  border-radius:12px;
  background:linear-gradient(135deg,#8b5cf6,#6d28d9);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
  font-weight:bold;
  box-shadow:0 8px 20px rgba(124,58,237,.3);
}

.logo-text{
  font-size:16px;
  font-weight:800;
  line-height:1.2;
}

.logo-text span{
  display:block;
  color:#aab5d0;
  font-size:11px;
  font-weight:500;
  margin-top:3px;
}

.nav{
  padding:20px 14px;
  flex:1;
}

.nav-title{
  color:#687698;
  font-size:10px;
  font-weight:700;
  letter-spacing:1.2px;
  padding:0 12px 10px;
  text-transform:uppercase;
}

.nav button{
  width:100%;
  border:0;
  background:transparent;
  color:#aeb9d4;
  text-align:left;
  padding:13px 13px;
  border-radius:9px;
  margin-bottom:5px;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:12px;
  transition:.2s;
}

.nav button:hover{
  background:rgba(255,255,255,.06);
  color:#fff;
}

.nav button.active{
  background:#7445e8;
  color:#fff;
  box-shadow:0 8px 18px rgba(116,69,232,.22);
}

.nav-icon{
  width:20px;
  text-align:center;
  font-size:17px;
}

.sidebar-bottom{
  padding:15px 14px 20px;
  border-top:1px solid rgba(255,255,255,.08);
}

.website-btn{
  width:100%;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.05);
  color:#fff;
  padding:12px;
  border-radius:9px;
  cursor:pointer;
  font-weight:600;
}

/* ================= MAIN ================= */

.main{
  margin-left:250px;
  min-height:100vh;
}

.topbar{
  height:82px;
  background:#fff;
  border-bottom:1px solid #e9edf5;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 30px;
}

.page-title h1{
  font-size:22px;
  color:#182033;
}

.page-title p{
  font-size:12px;
  color:#8992a7;
  margin-top:5px;
}

.profile{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#7445e8;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  cursor:pointer;
}

.menu-button{
  display:none;
  width:42px;
  height:42px;
  border:0;
  border-radius:9px;
  background:#f0ecff;
  color:#6d3fe0;
  font-size:23px;
  cursor:pointer;
}

/* ================= CONTENT ================= */

.content{
  padding:30px;
}

.hero{
  background:linear-gradient(135deg,#7142df,#8c5ce8);
  color:#fff;
  border-radius:16px;
  padding:25px 28px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
  box-shadow:0 12px 30px rgba(104,65,215,.16);
}

.hero h2{
  font-size:23px;
  margin-bottom:7px;
}

.hero p{
  font-size:13px;
  color:#e7ddff;
}

.add-btn{
  border:0;
  background:#fff;
  color:#6435d1;
  padding:12px 18px;
  border-radius:9px;
  font-size:13px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 7px 16px rgba(0,0,0,.12);
}

.add-btn:hover{
  transform:translateY(-1px);
}

/* ================= STATS ================= */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
  margin-bottom:25px;
}

.stat-card{
  background:#fff;
  border:1px solid #edf0f6;
  border-radius:14px;
  padding:20px;
  box-shadow:0 5px 15px rgba(28,38,64,.035);
}

.stat-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}

.stat-icon{
  width:40px;
  height:40px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f0ecff;
  font-size:19px;
}

.stat-number{
  font-size:25px;
  font-weight:800;
}

.stat-label{
  font-size:12px;
  color:#8992a7;
}

/* ================= ROOM SECTION ================= */

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:17px;
}

.section-head h2{
  font-size:18px;
}

.room-count{
  color:#8b93a7;
  font-size:12px;
}

.rooms-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.room-card{
  background:#fff;
  border:1px solid #e9edf5;
  border-radius:15px;
  overflow:visible;
  box-shadow:0 6px 18px rgba(30,40,70,.045);
  position:relative;
}

.room-image{
  height:175px;
  background:#e9edf5;
  overflow:hidden;
  border-radius:15px 15px 0 0;
  position:relative;
}

.room-image img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.no-image{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
  color:#aeb6c8;
}

.status{
  position:absolute;
  top:12px;
  left:12px;
  padding:6px 10px;
  border-radius:20px;
  font-size:10px;
  font-weight:800;
  background:#fff;
  box-shadow:0 4px 10px rgba(0,0,0,.1);
}

.status.available{
  color:#16864b;
}

.status.occupied{
  color:#d33c3c;
}

.status.maintenance{
  color:#b06b00;
}

.room-info{
  padding:18px;
}

.room-name{
  font-size:17px;
  font-weight:800;
  margin-bottom:5px;
  padding-right:35px;
}

.room-number{
  font-size:11px;
  color:#929bad;
  margin-bottom:14px;
}

.room-bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.price{
  font-size:17px;
  font-weight:800;
  color:#6b3ed9;
}

.price span{
  color:#8e96a9;
  font-size:11px;
  font-weight:500;
}

.capacity{
  font-size:11px;
  color:#81899d;
}

/* ================= THREE DOT ================= */

.dots-btn{
  position:absolute;
  right:13px;
  top:190px;
  width:32px;
  height:32px;
  border:0;
  border-radius:8px;
  background:#f5f3ff;
  color:#6540d0;
  font-size:20px;
  line-height:28px;
  cursor:pointer;
  z-index:20;
}

.action-menu{
  position:absolute;
  right:13px;
  top:225px;
  width:165px;
  background:#fff;
  border:1px solid #e7eaf1;
  border-radius:10px;
  padding:6px;
  box-shadow:0 15px 35px rgba(30,40,70,.15);
  z-index:100;
  display:none;
}

.action-menu.show{
  display:block;
}

.action-menu button{
  width:100%;
  border:0;
  background:#fff;
  text-align:left;
  padding:10px;
  border-radius:7px;
  font-size:12px;
  color:#374151;
  cursor:pointer;
}

.action-menu button:hover{
  background:#f5f3ff;
  color:#6638d4;
}

.action-menu .delete-option{
  color:#d33d3d;
}

.action-menu .delete-option:hover{
  background:#fff0f0;
  color:#c62828;
}

/* ================= EMPTY ================= */

.empty{
  background:#fff;
  border:1px dashed #d9deea;
  border-radius:15px;
  padding:50px 20px;
  text-align:center;
  color:#8d96aa;
}

.empty-icon{
  font-size:42px;
  margin-bottom:10px;
}

.empty h3{
  color:#4a5367;
  margin-bottom:5px;
}

/* ================= MODAL ================= */

.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(8,17,40,.58);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:3000;
}

.modal-overlay.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:520px;
  max-height:90vh;
  overflow-y:auto;
  background:#fff;
  border-radius:16px;
  box-shadow:0 25px 60px rgba(0,0,0,.25);
}

.modal-header{
  padding:20px 22px;
  border-bottom:1px solid #edf0f5;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.modal-header h2{
  font-size:18px;
}

.close-modal{
  width:34px;
  height:34px;
  border:0;
  border-radius:8px;
  background:#f4f5f8;
  cursor:pointer;
  font-size:20px;
  color:#6f7788;
}

.form{
  padding:22px;
}

.form-group{
  margin-bottom:16px;
}

.form-group label{
  display:block;
  font-size:12px;
  font-weight:700;
  color:#50596b;
  margin-bottom:7px;
}

.form-group input,
.form-group select{
  width:100%;
  height:43px;
  border:1px solid #dfe4ed;
  border-radius:8px;
  padding:0 12px;
  outline:none;
  font-size:13px;
  color:#20283a;
  background:#fff;
}

.form-group input:focus,
.form-group select:focus{
  border-color:#7544e5;
  box-shadow:0 0 0 3px rgba(117,68,229,.09);
}

.form-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.modal-footer{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  padding:0 22px 22px;
}

.cancel-btn,
.save-btn{
  border:0;
  border-radius:8px;
  padding:11px 18px;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
}

.cancel-btn{
  background:#f0f2f6;
  color:#566074;
}

.save-btn{
  background:#7445e8;
  color:#fff;
}

/* ================= TOAST ================= */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translate(-50%,20px);
  background:#17213a;
  color:#fff;
  padding:12px 18px;
  border-radius:9px;
  font-size:12px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:5000;
  box-shadow:0 10px 25px rgba(0,0,0,.2);
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* ================= OVERLAY ================= */

.sidebar-overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(4,10,25,.48);
  z-index:900;
}

.sidebar-overlay.show{
  display:block;
}

/* ================= MOBILE ================= */

@media(max-width:1000px){
  .rooms-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:800px){

  .sidebar{
    transform:translateX(-100%);
    box-shadow:15px 0 35px rgba(0,0,0,.18);
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    margin-left:0;
  }

  .topbar{
    height:70px;
    padding:0 15px;
  }

  .menu-button{
    display:block;
    order:-1;
    margin-right:12px;
  }

  .topbar-left{
    display:flex;
    align-items:center;
  }

  .page-title h1{
    font-size:18px;
  }

  .page-title p{
    font-size:10px;
  }

  .profile{
    width:36px;
    height:36px;
  }

  .content{
    padding:18px 15px 30px;
  }

  .hero{
    padding:20px;
    display:block;
  }

  .hero h2{
    font-size:20px;
  }

  .hero p{
    margin-bottom:17px;
  }

  .add-btn{
    width:100%;
  }

  .rooms-grid{
    grid-template-columns:1fr;
  }

  .stats{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .stat-card{
    padding:15px;
  }

  .stat-number{
    font-size:21px;
  }

  .section-head h2{
    font-size:16px;
  }

  .room-image{
    height:190px;
  }

  .dots-btn{
    top:205px;
  }

  .action-menu{
    top:240px;
  }
}

@media(max-width:430px){

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .stat-card{
    padding:13px;
  }

  .stat-icon{
    width:34px;
    height:34px;
  }

  .stat-number{
    font-size:19px;
  }

  .stat-label{
    font-size:10px;
  }

  .form-row{
    grid-template-columns:1fr;
    gap:0;
  }
}
</style>
</head>

<body>

<!-- ================= SIDEBAR ================= -->

<aside class="sidebar" id="sidebar">

  <div class="logo">
    <div class="logo-icon">R</div>
    <div class="logo-text">
      Royal Palace
      <span>HOTEL ADMIN</span>
    </div>
  </div>

  <nav class="nav">

    <div class="nav-title">MAIN MENU</div>

    <button type="button" onclick="goToPage('dashboard.html')">
      <span class="nav-icon">▦</span>
      <span>Dashboard</span>
    </button>

    <button type="button" class="active">
      <span class="nav-icon">▣</span>
      <span>Room Management</span>
    </button>

    <button type="button" onclick="goToPage('bookings.html')">
      <span class="nav-icon">▤</span>
      <span>Booking History</span>
    </button>

    <button type="button" onclick="goToPage('hotel.html')">
      <span class="nav-icon">⌂</span>
      <span>Hotel Details</span>
    </button>

    <button type="button" onclick="goToPage('photos.html')">
      <span class="nav-icon">▧</span>
      <span>Photos</span>
    </button>

    <button type="button" onclick="goToPage('settings.html')">
      <span class="nav-icon">⚙</span>
      <span>Settings</span>
    </button>

  </nav>

  <div class="sidebar-bottom">
    <button class="website-btn" type="button" onclick="goToPage('index.html')">
      🌐 &nbsp; View Website
    </button>
  </div>

</aside>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<!-- ================= MAIN ================= -->

<main class="main">

  <header class="topbar">

    <div class="topbar-left">
      <button
        type="button"
        class="menu-button"
        id="menuButton"
        onclick="toggleSidebar()"
        aria-label="Open Menu"
        aria-expanded="false">
        ☰
      </button>

      <div class="page-title">
        <h1>Room Management</h1>
        <p>Manage hotel rooms and availability</p>
      </div>
    </div>

    <div class="profile">A</div>

  </header>

  <section class="content">

    <!-- HERO -->

    <div class="hero">
      <div>
        <h2>Room Management</h2>
        <p>Add, edit and manage all rooms of Royal Palace Hotel.</p>
      </div>

      <button
        type="button"
        class="add-btn"
        onclick="openAddRoom()">
        ＋ Add New Room
      </button>
    </div>

    <!-- STATS -->

    <div class="stats">

      <div class="stat-card">
        <div class="stat-top">
          <div class="stat-icon">🏨</div>
        </div>
        <div class="stat-number" id="totalRooms">0</div>
        <div class="stat-label">Total Rooms</div>
      </div>

      <div class="stat-card">
        <div class="stat-top">
          <div class="stat-icon">✓</div>
        </div>
        <div class="stat-number" id="availableRooms">0</div>
        <div class="stat-label">Available</div>
      </div>

      <div class="stat-card">
        <div class="stat-top">
          <div class="stat-icon">👤</div>
        </div>
        <div class="stat-number" id="occupiedRooms">0</div>
        <div class="stat-label">Occupied</div>
      </div>

      <div class="stat-card">
        <div class="stat-top">
          <div class="stat-icon">🔧</div>
        </div>
        <div class="stat-number" id="maintenanceRooms">0</div>
        <div class="stat-label">Maintenance</div>
      </div>

    </div>

    <!-- ROOMS -->

    <div class="section-head">
      <h2>All Rooms</h2>
      <div class="room-count" id="roomCount">0 rooms</div>
    </div>

    <div class="rooms-grid" id="roomsGrid"></div>

  </section>

</main>

<!-- ================= MODAL ================= -->

<div class="modal-overlay" id="roomModal">

  <div class="modal">

    <div class="modal-header">
      <h2 id="modalTitle">Add New Room</h2>

      <button
        type="button"
        class="close-modal"
        onclick="closeRoomModal()">
        ×
      </button>
    </div>

    <form class="form" id="roomForm">

      <div class="form-row">

        <div class="form-group">
          <label for="roomNumber">Room Number</label>
          <input
            id="roomNumber"
            type="text"
            placeholder="e.g. 101"
            required>
        </div>

        <div class="form-group">
          <label for="roomName">Room Name</label>
          <input
            id="roomName"
            type="text"
            placeholder="e.g. Premium Room"
            required>
        </div>

      </div>

      <div class="form-row">

        <div class="form-group">
          <label for="roomPrice">Price / Night (₹)</label>
          <input
            id="roomPrice"
            type="number"
            min="0"
            placeholder="2500"
            required>
        </div>

        <div class="form-group">
          <label for="roomCapacity">Capacity</label>
          <select id="roomCapacity">
            <option value="1 Guest">1 Guest</option>
            <option value="2 Guests" selected>2 Guests</option>
            <option value="3 Guests">3 Guests</option>
            <option value="4 Guests">4 Guests</option>
            <option value="5 Guests">5 Guests</option>
            <option value="6 Guests">6 Guests</option>
          </select>
        </div>

      </div>

      <div class="form-group">
        <label for="roomStatus">Status</label>

        <select id="roomStatus">
          <option value="Available">Available</option>
          <option value="Occupied">Occupied</option>
          <option value="Maintenance">Maintenance</option>
        </select>
      </div>

      <div class="form-group">
        <label for="roomImage">Image URL</label>

        <input
          id="roomImage"
          type="text"
          placeholder="premium-room.jpg">
      </div>

    </form>

    <div class="modal-footer">

      <button
        type="button"
        class="cancel-btn"
        onclick="closeRoomModal()">
        Cancel
      </button>

      <button
        type="button"
        class="save-btn"
        onclick="saveRoom()">
        Save Room
      </button>

    </div>

  </div>

</div>

<!-- ================= TOAST ================= -->

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   ROYAL PALACE HOTEL - ROOM MANAGEMENT
   Standalone JavaScript
========================================================= */

var ROOM_STORAGE_KEY = "royal_palace_rooms";
var editingRoomId = null;

var defaultRooms = [
  {
    id:"room_101",
    number:"101",
    name:"Premium Room",
    price:2500,
    capacity:"2 Guests",
    status:"Available",
    image:"premium-room.jpg"
  },
  {
    id:"room_102",
    number:"102",
    name:"Royal Suite",
    price:4500,
    capacity:"3 Guests",
    status:"Available",
    image:"royal-suite.jpg"
  },
  {
    id:"room_103",
    number:"103",
    name:"Royal Palace Suite",
    price:6500,
    capacity:"4 Guests",
    status:"Available",
    image:""
  }
];

var rooms = [];


/* ================= BASIC HELPERS ================= */

function getElement(id){
  return document.getElementById(id);
}

function escapeHTML(value){
  return String(value == null ? "" : value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* ================= NAVIGATION ================= */

function goToPage(page){

  closeSidebar();
  closeAllRoomMenus();

  /*
    Small delay gives the mobile menu time to close
    before changing the page.
  */
  setTimeout(function(){
    window.location.href = page;
  },50);
}


/* ================= MOBILE SIDEBAR ================= */

function toggleSidebar(){

  var sidebar = getElement("sidebar");
  var overlay = getElement("sidebarOverlay");
  var button = getElement("menuButton");

  if(!sidebar || !overlay){
    return;
  }

  if(sidebar.classList.contains("open")){
    closeSidebar();
  }else{
    sidebar.classList.add("open");
    overlay.classList.add("show");

    if(button){
      button.setAttribute("aria-expanded","true");
    }
  }
}

function closeSidebar(){

  var sidebar = getElement("sidebar");
  var overlay = getElement("sidebarOverlay");
  var button = getElement("menuButton");

  if(sidebar){
    sidebar.classList.remove("open");
  }

  if(overlay){
    overlay.classList.remove("show");
  }

  if(button){
    button.setAttribute("aria-expanded","false");
  }
}
