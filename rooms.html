<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Royal Palace Hotel - Room Management</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f6fa;
    color:#111827;
}

/* SIDEBAR */
.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:250px;
    background:#111827;
    color:#fff;
    padding:22px 14px;
    z-index:1000;
    transition:.3s;
}

.logo{
    font-size:22px;
    font-weight:800;
    padding:5px 12px 28px;
}

.logo span{
    color:#8b5cf6;
}

.nav-title{
    color:#8d95a5;
    font-size:11px;
    font-weight:bold;
    padding:0 12px 10px;
    text-transform:uppercase;
}

.nav a{
    display:flex;
    align-items:center;
    gap:12px;
    text-decoration:none;
    color:#cbd5e1;
    padding:12px 13px;
    margin:4px 0;
    border-radius:9px;
    font-size:14px;
    transition:.2s;
}

.nav a:hover{
    background:#1f2937;
    color:#fff;
}

.nav a.active{
    background:#7c3aed;
    color:#fff;
}

.bottom-link{
    position:absolute;
    left:14px;
    right:14px;
    bottom:20px;
}

.bottom-link a{
    background:#1f2937;
}

/* MAIN */
.main{
    margin-left:250px;
    min-height:100vh;
}

/* TOPBAR */
.topbar{
    height:82px;
    background:#fff;
    border-bottom:1px solid #e5e7eb;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 30px;
}

.top-left{
    display:flex;
    align-items:center;
    gap:14px;
}

.menu-btn{
    display:none;
    border:0;
    background:none;
    font-size:27px;
    cursor:pointer;
}

.page-title{
    font-size:20px;
    font-weight:700;
}

.profile{
    width:42px;
    height:42px;
    border-radius:50%;
    background:#7c3aed;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
}

/* CONTENT */
.content{
    padding:28px 30px 50px;
}

/* HERO */
.hero{
    background:linear-gradient(135deg,#7c3aed,#9333ea);
    color:#fff;
    padding:27px 28px;
    border-radius:15px;
    margin-bottom:25px;
    box-shadow:0 10px 25px rgba(124,58,237,.15);
}

.hero h1{
    margin:0 0 7px;
    font-size:25px;
}

.hero p{
    margin:0;
    opacity:.9;
}

/* STATS */
.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
    margin-bottom:28px;
}

.stat{
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:20px;
}

.stat-label{
    color:#6b7280;
    font-size:13px;
    margin-bottom:9px;
}

.stat-number{
    font-size:27px;
    font-weight:800;
}

/* SECTION HEAD */
.section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
}

.section-head h2{
    margin:0;
    font-size:19px;
}

.add-btn{
    border:0;
    background:#7c3aed;
    color:#fff;
    padding:11px 17px;
    border-radius:9px;
    font-weight:700;
    cursor:pointer;
}

.add-btn:hover{
    background:#6d28d9;
}

/* ROOMS GRID */
.rooms-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.room-card{
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:15px;
    overflow:visible;
    box-shadow:0 4px 14px rgba(0,0,0,.04);
    position:relative;
}

.room-image{
    height:190px;
    background:#eef0f5;
    border-radius:15px 15px 0 0;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#9ca3af;
}

.room-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.room-body{
    padding:18px;
}

.room-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
}

.room-name{
    margin:0 0 5px;
    font-weight:750;
    font-size:17px;
}

.room-no{
    font-size:13px;
    color:#6b7280;
}

.price{
    color:#7c3aed;
    font-weight:800;
    white-space:nowrap;
}

.price small{
    color:#6b7280;
    font-weight:400;
    font-size:11px;
}

.status{
    display:inline-block;
    margin-top:14px;
    padding:6px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:700;
}

.status.available{
    background:#dcfce7;
    color:#166534;
}

.status.booked{
    background:#fee2e2;
    color:#991b1b;
}

.status.maintenance{
    background:#fef3c7;
    color:#92400e;
}

/* THREE DOT */
.room-menu-wrap{
    position:absolute;
    right:12px;
    top:12px;
    z-index:50;
}

.room-menu-btn{
    width:36px;
    height:36px;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.95);
    box-shadow:0 3px 12px rgba(0,0,0,.15);
    font-size:20px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
}

.room-menu-btn:hover{
    background:#f3f4f6;
}

.room-menu{
    display:none;
    position:absolute;
    right:0;
    top:42px;
    width:170px;
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:10px;
    box-shadow:0 12px 30px rgba(0,0,0,.16);
    overflow:hidden;
}

.room-menu.show{
    display:block;
}

.room-menu button{
    width:100%;
    border:0;
    background:#fff;
    text-align:left;
    padding:12px 14px;
    cursor:pointer;
    font-size:13px;
}

.room-menu button:hover{
    background:#f5f3ff;
}

.room-menu .delete-option{
    color:#dc2626;
}

/* ACTION AREA */
.room-actions{
    display:flex;
    gap:8px;
    margin-top:15px;
}

.action-btn{
    flex:1;
    border:1px solid #e5e7eb;
    background:#fff;
    padding:9px;
    border-radius:8px;
    cursor:pointer;
    font-size:12px;
    font-weight:700;
}

.action-btn.edit:hover{
    background:#f5f3ff;
    color:#7c3aed;
}

.action-btn.delete:hover{
    background:#fef2f2;
    color:#dc2626;
}

/* MODAL */
.modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(15,23,42,.6);
    z-index:2000;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-overlay.show{
    display:flex;
}

.modal{
    background:#fff;
    width:100%;
    max-width:500px;
    border-radius:16px;
    padding:25px;
    box-shadow:0 25px 60px rgba(0,0,0,.25);
}

.modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.modal-head h2{
    margin:0;
    font-size:20px;
}

.close-btn{
    border:0;
    background:#f3f4f6;
    width:34px;
    height:34px;
    border-radius:50%;
    cursor:pointer;
    font-size:18px;
}

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    font-size:13px;
    font-weight:700;
    margin-bottom:7px;
}

.form-group input,
.form-group select{
    width:100%;
    border:1px solid #d1d5db;
    border-radius:8px;
    padding:11px 12px;
    outline:none;
    font-size:14px;
}

.form-group input:focus,
.form-group select:focus{
    border-color:#7c3aed;
}

.modal-buttons{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.modal-buttons button{
    flex:1;
    padding:11px;
    border-radius:8px;
    cursor:pointer;
    font-weight:700;
}

.cancel-btn{
    background:#fff;
    border:1px solid #d1d5db;
}

.save-btn{
    background:#7c3aed;
    color:#fff;
    border:0;
}

/* TOAST */
.toast{
    position:fixed;
    right:25px;
    bottom:25px;
    background:#111827;
    color:#fff;
    padding:13px 18px;
    border-radius:9px;
    display:none;
    z-index:3000;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.toast.show{
    display:block;
}

.sidebar-overlay{
    display:none;
}

/* EMPTY */
.empty{
    grid-column:1/-1;
    background:#fff;
    border:1px dashed #d1d5db;
    padding:40px 20px;
    text-align:center;
    border-radius:14px;
    color:#6b7280;
}

/* MOBILE */
@media(max-width:1000px){

    .rooms-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:800px){

    .sidebar{
        transform:translateX(-100%);
    }

    .sidebar.open{
        transform:translateX(0);
    }

    .main{
        margin-left:0;
    }

    .menu-btn{
        display:block;
    }

    .topbar{
        padding:0 18px;
    }

    .content{
        padding:20px 16px 40px;
    }

    .sidebar-overlay{
        position:fixed;
        inset:0;
        background:rgba(0,0,0,.45);
        z-index:900;
    }

    .sidebar-overlay.show{
        display:block;
    }

}

@media(max-width:650px){

    .rooms-grid{
        grid-template-columns:1fr;
    }

    .stats{
        grid-template-columns:1fr 1fr;
        gap:12px;
    }

    .stat{
        padding:16px;
    }

    .stat-number{
        font-size:23px;
    }

    .section-head{
        align-items:flex-start;
        gap:12px;
    }

    .section-head h2{
        font-size:17px;
    }

    .add-btn{
        padding:9px 12px;
        font-size:12px;
    }

    .hero{
        padding:22px 20px;
    }

    .hero h1{
        font-size:21px;
    }

    .topbar{
        height:70px;
    }

    .page-title{
        font-size:17px;
    }

}

@media(max-width:400px){

    .stats{
        grid-template-columns:1fr;
    }

}
</style>
</head>

<body>

<aside class="sidebar" id="sidebar">

    <div class="logo">
        Royal <span>Palace</span>
    </div>

    <div class="nav-title">
        MAIN MENU
    </div>

    <nav class="nav">

        <a href="dashboard.html" onclick="closeSidebar()">

<div

<main class="main">

    <header class="topbar">

        <div class="top-left">

            <button

                id="menuButton"

            >☰</button>

            </div>

        </div>

    </header>

    <section class="content">

        </div>

        <div class="stats">

            <div class="stat">

                <div

            <div class="stat">

            <div class="stat">

</main>

<div
    class="modal-overlay"
    id="roomModal">

    <div class="modal">

        <div class="modal-head">

            <h2 id="modalTitle">
                Add New Room
            </h2>

            <button
                class="close-btn"

            </button>

        </div>

        <form
            id="roomForm"
            onsubmit="saveRoom(event)">

            <div class="form-group">

                <label>
                    Room Name
                </label>

                <input
                    type="text"
                    id="roomName"
                    placeholder="Example: Premium Room"
                    required>

            </div>

            <div class="form-group">

                <label>
                    Room Number
                </label>

                <input
                    type="text"
                    id="roomNumber"
                    placeholder="Example: 104"
                    required>

            </div>

            <div class="form-group">

                <label>
                    Price Per Night (₹)
                </label>

                <input
                    type="number"
                    id="roomPrice"
                    placeholder="Example: 2500"
                    min="0"
                    required>

            </div>

            <div class="form-group">

                <label>
                    Status
                </label>

                <select id="roomStatus">

                    <option value="available">
                        Available
                    </option>

                    <option value="booked">
                        Booked
                    </option>

                    <option value="maintenance">
                        Maintenance
                    </option>

                </select>

            </div>

            <div class="form-group">

                <label>
                    Room Image
                </label>

                <input
                    type="text"
                    id="roomImage"
                    placeholder="Example: premium-room.jpg">

            </div>

            <div class="modal-buttons">

                <button
                    type="button"
                    class="cancel-btn"
                    onclick="closeRoomModal()">
                    Cancel
                </button>

                <button
                    type="submit"
                    class="save-btn">
                    Save Room
                </button>

            </div>

        </form>

    </div>

</div>

<div
    class="toast"
    id="toast">
</div>

<script>

var ROOM_KEY = "royal_palace_rooms";

var rooms = [];

var editingId = null;

var defaultRooms = [

    {
        id:"room_101",
        name:"Premium Room",
        number:"101",
        price:2500,
        status:"available",
        image:"premium-room.jpg"
    },

    {
        id:"room_102",
        name:"Royal Suite",
        number:"102",
        price:4500,
        status:"available",
        image:"royal-suite.jpg"
    },

    {
        id:"room_103",
        name:"Royal Palace Suite",
        number:"103",
        price:6500,
        status:"available",
        image:""
    }

];

function $(id){
    return document.getElementById(id);
}

function escapeHtml(value){

    return String(value == null ? "" : value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

function saveRooms(){

    try{

        localStorage.setItem(
            ROOM_KEY,
            JSON.stringify(rooms)
        );

    }catch(error){

        console.log(error);

    }

}

function loadRooms(){

    var raw = null;

    try{

        raw = localStorage.getItem(ROOM_KEY);

    }catch(error){

        raw = null;

    }

    if(raw === null){

        rooms = JSON.parse(
            JSON.stringify(defaultRooms)
        );

        saveRooms();

        return;

    }

    try{

        var data = JSON.parse(raw);

        if(Array.isArray(data)){

            rooms = data;

        }else{

            rooms = JSON.parse(
                JSON.stringify(defaultRooms)
            );

            saveRooms();

        }

    }catch(error){

        rooms = JSON.parse(
            JSON.stringify(defaultRooms)
        );

        saveRooms();

    }

}

function updateStats(){

    var total = rooms.length;
    var available = 0;
    var booked = 0;
    var maintenance = 0;

    for(var i=0;i<rooms.length;i++){

        var status = String(
            rooms[i].status || "available"
        ).toLowerCase();

        if(status === "available"){
            available++;
        }

        if(status === "booked"){
            booked++;
        }

        if(status === "maintenance"){
            maintenance++;
        }

    }

    if($("totalRooms")){
        $("totalRooms").textContent = total;
    }

    if($("availableRooms")){
        $("availableRooms").textContent = available;
    }

    if($("bookedRooms")){
        $("bookedRooms").textContent = booked;
    }

    if($("maintenanceRooms")){
        $("maintenanceRooms").textContent = maintenance;
    }

}

function closeRoomMenus(){

    var menus = document.querySelectorAll(".room-menu");

    for(var i=0;i<menus.length;i++){

        menus[i].classList.remove("show");

    }

}

function renderRooms(){

    var grid = $("roomsGrid");

    if(!grid){
        return;
    }

    closeRoomMenus();

    if(rooms.length === 0){

        grid.innerHTML =
            '<div class="empty">' +
            'No rooms found. Tap “+ Add New Room” to create your first room.' +
            '</div>';

        return;

    }

    var html = "";

    for(var i=0;i<rooms.length;i++){

        var r = rooms[i];

        var status = String(
            r.status || "available"
        ).toLowerCase();

        var statusText =
            status.charAt(0).toUpperCase() +
            status.slice(1);

        html += '<div class="room-card">';

        html += '<div class="room-image">';

        if(r.image){

            html +=
                '<img src="' +
                escapeHtml(r.image) +
                '" alt="' +
                escapeHtml(r.name) +
                '" onerror="this.style.display=\'none\';this.parentNode.innerHTML=\'<span>No Image</span>\'">';

        }else{

            html += '<span>No Image</span>';

        }

        html += '</div>';

        html +=
            '<div class="room-menu-wrap">' +

                '<button class="room-menu-btn" ' +
                    'type="button" ' +
                    'data-menu-id="' +
                    escapeHtml(r.id) +
                '">' +

                    '⋮' +

                '</button>' +

                '<div class="room-menu" ' +
                    'id="menu-' +
                    escapeHtml(r.id) +
                '">' +

                    '<button type="button" ' +
                        'data-edit-id="' +
                        escapeHtml(r.id) +
                    '">' +

                        '✏️ Edit Room' +

                    '</button>' +

                    '<button type="bu
