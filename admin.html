<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Royal Palace Hotel - Admin Panel</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#111827;
}

header{
  background:#111827;
  color:white;
  padding:20px;
}

.header-inner{
  max-width:1200px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

h1{
  margin:0;
  font-size:25px;
}

.subtitle{
  margin-top:5px;
  color:#cbd5e1;
}

.logout{
  background:#dc2626;
  color:white;
  border:0;
  padding:11px 16px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.container{
  max-width:1200px;
  margin:25px auto;
  padding:0 15px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:20px;
}

.refresh{
  background:#111827;
  color:white;
  border:0;
  padding:12px 18px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:25px;
}

.card{
  background:white;
  padding:22px;
  border-radius:14px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.card-title{
  color:#64748b;
  font-size:14px;
}

.card-value{
  font-size:30px;
  font-weight:bold;
  margin-top:8px;
}

.panel{
  background:white;
  border-radius:14px;
  padding:20px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.panel h2{
  margin-top:0;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:1050px;
}

th,td{
  padding:12px 10px;
  border-bottom:1px solid #e2e8f0;
  text-align:left;
  font-size:14px;
}

th{
  background:#f8fafc;
}

.status{
  display:inline-block;
  padding:6px 10px;
  border-radius:20px;
  font-weight:bold;
  font-size:12px;
}

.confirmed{
  background:#dcfce7;
  color:#166534;
}

.cancelled{
  background:#fee2e2;
  color:#991b1b;
}

.action-btn{
  border:0;
  padding:7px 10px;
  border-radius:6px;
  cursor:pointer;
  font-size:12px;
  font-weight:bold;
  margin:2px;
}

.confirm-btn{
  background:#16a34a;
  color:white;
}

.cancel-btn{
  background:#dc2626;
  color:white;
}

.action-btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.message{
  padding:12px;
  border-radius:8px;
  margin-bottom:15px;
  display:none;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}

.success{
  background:#dcfce7;
  color:#166534;
}

@media(max-width:700px){

  .cards{
    grid-template-columns:1fr;
  }

  .header-inner{
    align-items:flex-start;
    flex-direction:column;
  }

  .topbar{
    align-items:flex-start;
    flex-direction:column;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <div>
      <h1>🏨 Royal Palace Hotel</h1>
      <div class="subtitle">Admin / Control Panel</div>
    </div>

    <button class="logout" onclick="logout()">
      Logout
    </button>

  </div>
</header>

<div class="container">

  <div class="topbar">
    <h2>Dashboard</h2>

    <button class="refresh" onclick="loadBookings()">
      🔄 Refresh Bookings
    </button>
  </div>

  <div id="message" class="message"></div>

  <div class="cards">

    <div class="card">
      <div class="card-title">Total Rooms</div>
      <div class="card-value">3</div>
    </div>

    <div class="card">
      <div class="card-title">Total Bookings</div>
      <div class="card-value" id="totalBookings">0</div>
    </div>

    <div class="card">
      <div class="card-title">Revenue</div>
      <div class="card-value" id="revenue">₹0</div>
    </div>

  </div>

  <div class="panel">

    <h2>📋 Recent Bookings</h2>

    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>Booking ID</th>
            <th>Guest Name</th>
            <th>Mobile</th>
            <th>Room</th>
            <th>Check-in</th>
            <th>Check-out</th>
            <th>Guests</th>
            <th>Nights</th>
            <th>Amount</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="bookingTable">
        </tbody>

      </table>

    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://mvvfqkcgaxcipjkiyuae.supabase.co";

const SUPABASE_KEY =
"sb_publishable_YbyO8KHdQxXyv6afqJZfWg_Eu2aw57x";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* Check Admin Login */
async function checkLogin(){

  const { data } = await db.auth.getSession();

  if(!data.session){

    window.location.href = "login.html";
    return false;

  }

  return true;
}


/* Logout */
async function logout(){

  await db.auth.signOut();

  window.location.href = "login.html";
}


/* Message */
function showMessage(text,type){

  const box =
    document.getElementById("message");

  box.textContent = text;
  box.className = "message " + type;
  box.style.display = "block";

  setTimeout(()=>{
    box.style.display = "none";
  },3000);
}


/* Load Bookings */
async function loadBookings(){

  const loggedIn = await checkLogin();

  if(!loggedIn) return;

  const table =
    document.getElementById("bookingTable");

  table.innerHTML =
    "<tr><td colspan='11'>Loading bookings...</td></tr>";

  const { data, error } = await db
    .from("bookings")
    .select("*")
    .order("created_at", {
      ascending:false
    });

  if(error){

    table.innerHTML =
      "<tr><td colspan='11'>Error: "
      + error.message +
      "</td></tr>";

    return;
  }

  document.getElementById("totalBookings")
    .textContent = data.length;


  let revenue = 0;

  data.forEach(row=>{

    revenue += Number(row.total || 0);

  });

  document.getElementById("revenue")
    .textContent =
    "₹" + revenue.toLocaleString("en-IN");


  if(data.length === 0){

    table.innerHTML =
      "<tr><td colspan='11'>No bookings found.</td></tr>";

    return;
  }


  table.innerHTML = "";


  data.forEach(row=>{

    const tr =
      document.createElement("tr");


    const status =
      row.status || "Confirmed";


    const statusClass =
      status === "Cancelled"
      ? "cancelled"
      : "confirmed";


    tr.innerHTML = `

      <td>${escapeHtml(row.booking_id || "-")}</td>

      <td>${escapeHtml(row.guest_name || "-")}</td>

      <td>${escapeHtml(row.mobile || "-")}</td>

      <td>${escapeHtml(row.room || "-")}</td>

      <td>${escapeHtml(row.checkin || "-")}</td>

      <td>${escapeHtml(row.checkout || "-")}</td>

      <td>${row.guests || "-"}</td>

      <td>${row.nights || "-"}</td>

      <td>₹${Number(row.total || 0).toLocaleString("en-IN")}</td>

      <td>
        <span class="status ${statusClass}">
          ${escapeHtml(status)}
        </span>
      </td>

      <td>

        <button
          class="action-btn confirm-btn"
          onclick="changeStatus('${row.id}','Confirmed')"
          ${status === "Confirmed" ? "disabled" : ""}
        >
          ✓ Confirm
        </button>

        <button
          class="action-btn cancel-btn"
          onclick="changeStatus('${row.id}','Cancelled')"
          ${status === "Cancelled" ? "disabled" : ""}
        >
          ✕ Cancel
        </button>

      </td>

    `;

    table.appendChild(tr);

  });

}


/* Change Booking Status */
async function changeStatus(id,newStatus){

  const loggedIn = await checkLogin();

  if(!loggedIn) return;


  const ok =
    confirm(
      "Booking status को " +
      newStatus +
      " करना है?"
    );

  if(!ok) return;


  const { error } = await db
    .from("bookings")
    .update({
      status:newStatus
    })
    .eq("id",id);


  if(error){

    showMessage(
      "Status update नहीं हुआ: " +
      error.message,
      "error"
    );

    return;
  }


  showMessage(
    "Booking status " +
    newStatus +
    " हो गया।",
    "success"
  );


  loadBookings();

}


/* Basic HTML protection */
function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* Start */
checkLogin().then(ok=>{

  if(ok){
    loadBookings();
  }

});

</script>

</body>
</html>
