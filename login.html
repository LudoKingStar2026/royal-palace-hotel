<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Royal Palace Hotel - Admin Login</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial,sans-serif;
  background:#111827;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:400px;
  background:white;
  padding:30px;
  border-radius:18px;
  box-shadow:0 15px 40px rgba(0,0,0,.3);
}

.logo{
  text-align:center;
  font-size:26px;
  font-weight:bold;
  color:#111827;
}

.subtitle{
  text-align:center;
  color:#64748b;
  margin:8px 0 25px;
}

label{
  display:block;
  margin:15px 0 7px;
  font-weight:bold;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  font-size:16px;
}

button{
  width:100%;
  margin-top:22px;
  padding:14px;
  border:0;
  border-radius:8px;
  background:#111827;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.error{
  color:#dc2626;
  text-align:center;
  margin-top:15px;
  display:none;
}
</style>
</head>

<body>

<div class="login-box">

  <div class="logo">🏨 Royal Palace Hotel</div>

  <div class="subtitle">
    Admin / Control Panel Login
  </div>

  <label>Email</label>
  <input
    id="email"
    type="email"
    placeholder="Enter admin email"
    autocomplete="username"
  >

  <label>Password</label>
  <input
    id="password"
    type="password"
    placeholder="Enter password"
    autocomplete="current-password"
  >

  <button id="loginBtn" onclick="login()">
    🔐 Login
  </button>

  <div id="error" class="error"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://mvvfqkcgaxcipjkiyuae.supabase.co";

const SUPABASE_KEY =
"sb_publishable_YbyO8KHdQxXyv6afqJZfWg_Eu2aw57x";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function login(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const errorBox =
    document.getElementById("error");

  const loginBtn =
    document.getElementById("loginBtn");

  errorBox.style.display = "none";
  errorBox.textContent = "";

  if(!email || !password){

    errorBox.textContent =
      "Email और Password दोनों भरें।";

    errorBox.style.display = "block";
    return;
  }

  loginBtn.disabled = true;
  loginBtn.textContent = "🔄 Login हो रहा है...";

  const { data, error } =
    await db.auth.signInWithPassword({
      email: email,
      password: password
    });

  if(error){

    errorBox.textContent =
      "Login failed: " + error.message;

    errorBox.style.display = "block";

    loginBtn.disabled = false;
    loginBtn.textContent = "🔐 Login";

    return;
  }

  if(data.session){

    window.location.href = "admin.html";

  }else{

    errorBox.textContent =
      "Login session नहीं बनी।";

    errorBox.style.display = "block";

    loginBtn.disabled = false;
    loginBtn.textContent = "🔐 Login";
  }

}

</script>

</body>
</html>
